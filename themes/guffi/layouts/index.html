{{ define "main" }}
<div class="homepage">
  <section class="hero">
    <div class="container">
      <p class="hero-bio">{{ .Site.Params.bio }}</p>
      <p class="hero-now">
        In 2023, he co-founded
        <a href="https://brineworks.tech" target="_blank" rel="noopener">Brineworks<span class="hero-now-arrow" aria-hidden="true">&#8599;</span></a>, which builds electrolyzers for low-cost capture of CO₂ from the air and production of green hydrogen. Its first demo plant opened in Amsterdam in 2026.
      </p>
      <div class="hero-video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/GoWgHgIDzGk"
          title="Brineworks video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
    </div>
  </section>
</div>
{{ end }}
