{{ define "main" }}
<div class="homepage">
  <section class="hero">
    <div class="container">
      <nav class="quick-links" aria-label="Calculators">
        <span class="quick-links-label">Calculators</span>
        <a class="quick-link" href="/solar-calculator/">Solar calculator</a>
        <a class="quick-link" href="/h2cost/">H₂ calculator</a>
        <a class="quick-link" href="/emethane/">E-methane calculator</a>
      </nav>
      <p class="hero-bio">{{ .Site.Params.bio }}</p>
      <p class="hero-now">
        Currently working on
        <a href="https://brineworks.tech" target="_blank" rel="noopener">Brineworks<span class="hero-now-arrow" aria-hidden="true">&#8599;</span></a>
      </p>
      <div class="hero-video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/GoWgHgIDzGk"
          title="Brineworks video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
    </div>
  </section>
</div>
{{ end }}
